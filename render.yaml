# Render Blueprint — NT$0 MVP production（`PRE-07`）
#
# 決策依據：docs/mvp-nt0-deployment-decision-2026-08-31.md（`DEC-16` / `DEC-17`）
# 環境變數契約：docs/production-environment-contract.md（`PRE-09`，儲存章節已由 DEC-16 更新）
#
# ## 這份檔案存在的理由
#
# repo 先前**沒有任何部署描述檔**，因此部署只能是一次性的手動點選 —— 無法稽核、無法重建。
# 這份 blueprint 讓兩個 service 的 region / build / start / health check / 環境變數**名稱**
# 成為版控的一部分。**值不在這裡**（見下）。
#
# ## Secret 一律不進版控
#
# 所有 `sync: false` 的變數都**不會**存在這個檔案裡。Render 在第一次建立 blueprint 時
# 會逐一提示輸入，之後由 dashboard 管理。這符合 CLAUDE.md §8：真實值只存在部署環境。
#
# ## 兩階段部署（無法避免，不是疏漏）
#
# `PUBLIC_BACKEND_URL` / `PUBLIC_WEB_URL` / `API_BASE_URL` 的值是 Render 配發的 hostname，
# 而 hostname 要等 service 建立之後才存在。因此：
#
#   第一階段  建立兩個 service（這三個變數先填暫時值，**不可留空**）
#   第二階段  兩個 URL 都產生後，回填正確值並各重新部署一次
#
# ⚠️ `PUBLIC_BACKEND_URL` **絕對不可留空**：`Backend/utils/publicUrl.js` 會回退成
# `http://localhost:3000`，而 `services/materialMedia.service.js` 會把那個絕對 URL
# **永久寫進** `cover_image_url` / `material_images.image_url` / `demo_video_url`。
# 事後修設定不會回寫既有列。
#
# ## 刻意沒有寫在這裡的東西
#
#   * **persistent disk** —— Render Free 不支援，而 NT$0 架構也不需要：
#     私有檔案走 `PRIVATE_FILE_STORAGE_DRIVER=s3`（Backblaze B2）。
#   * **`PRIVATE_FILE_STORAGE_PATH` / `PRIVATE_FILE_STORAGE_ALLOW_LOCAL_IN_PRODUCTION`**
#     —— 那兩個只屬於 `local` driver。在 s3 下設定它們是錯的訊號，代表有人以為
#     位元組還在容器磁碟上。
#   * **`SMTP_*`** —— `DEC-17` 明示 MVP 初期不啟用郵件。缺少時 backend 照常啟動、
#     照常收單，只是不寄信（fails soft，`REL-02` 已保證不會終止 process）。
#     匯款帳戶由結帳頁的 `GET /payment/bank-info` 提供，不依賴郵件。
#   * **`NEXT_DIST_DIR`** —— 那是本機驗收流程用的，production 用 Next 預設的 `.next`。
#   * ~~auto-deploy 設定~~ —— **2026-09-01 更新：已對照官方 Blueprint spec 確認
#     `autoDeployTrigger: off` 是正確語法（等同已棄用的 `autoDeploy: false`），
#     因此改為寫進本檔**。封閉測試期間不希望一次 push 就把服務重啟掉；
#     要手動部署時在 dashboard 按 Manual Deploy。
#
# ## Free plan 的已知行為（不是故障）
#
#   * 15 分鐘無流量會 spin down，喚醒約 1 分鐘；backend 冷啟動還要跑完
#     `ensureCoreTables()` 的全部 idempotent DDL，首次請求可能 30–60 秒。
#   * 750 free instance hours / 月是**整個 workspace 共用**，兩個 service 一起算。
#   * 單一 instance，不可水平擴充 —— 這與 `routes/order.js:27` 的
#     `uploadIdempotencyCache`（process 內狀態）需求一致。

# ## 服務名稱必須與實際已建立的 service 一致（2026-09-01）
#
# Backend 於 STEP 3 是**以 dashboard 手動建立**的（因為 Blueprint 會一次建立本檔
# 宣告的**全部**服務，而 STEP 3 的範圍只有 Backend）。實際服務名為
# `teaching-platform-backend`，本檔原本寫的是 `teaching-platform-api`。
#
# 名稱不一致不是美觀問題：**若日後直接套用這份 Blueprint，Render 會把名稱對不上的
# 項目當成新服務再建一個**，於是同一份程式碼跑兩個 service、共用同一個 750 free
# instance hours 額度，而且只有一個掛著正確的環境變數。因此這裡對齊為實際名稱。
#
# `teaching-platform-web` 尚未建立（STEP 5），維持預期名稱；建立時若 Render 因名稱
# 被占用而配發不同 hostname，必須回頭同步本檔與 `API_BASE_URL`／`PUBLIC_WEB_URL`。

services:
  # ---------------------------------------------------------------------------
  # Backend — Node / Express 5 / 單一 instance
  # ---------------------------------------------------------------------------
  - type: web
    name: teaching-platform-backend
    runtime: node
    plan: free
    region: singapore
    # rootDir 省略 ＝ repo 根目錄。root package.json 沒有 dependencies，
    # 依賴全在 Backend/，所以 build 要指定 --prefix。
    buildCommand: npm ci --prefix Backend
    startCommand: node Backend/index.js
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      # Node 18 已被 AWS SDK v3 於 2026-01 停止支援（s3 driver 依賴它）。
      - key: NODE_VERSION
        value: "22"
      # 這是其他三條 fail-closed 檢查的開關本身；未設會讓私有儲存檢查完全不武裝，
      # 且 /payment/bank-info 會對已登入者洩漏未設定的變數名清單。
      - key: NODE_ENV
        value: production
      # 缺／空白／佔位值／< 32 字元 → module load 即 throw，程序起不來。
      # 產生方式：openssl rand -base64 48
      # 輪換此值會使所有已簽發 token 失效（全體登出）。
      - key: JWT_SECRET
        sync: false
      # production 唯一可行路徑，且**必須帶明確 sslmode**。
      # 離散 PG* 那條路無法開 TLS（config/db.js 從不設 ssl 鍵）。
      #
      # 建議結尾用 **?sslmode=verify-full**，不是 require。
      # 實測 pg-connection-string 2.12.0：require 與 verify-full **都解析成 ssl={}**
      # （rejectUnauthorized 取 Node 預設 true → 會驗憑證），所以今天兩者行為完全相同。
      # 差別在未來：pg v9 / pg-connection-string v3 會把 require 改成 libpq 語意
      # （**不再驗憑證**），verify-full 則不受影響。現在寫死它等於把已驗證的行為釘住。
      - key: DATABASE_URL
        sync: false

      # --- 私有檔案儲存（Backblaze B2，DEC-16）---
      # generic S3 driver：換供應商只需改下面五個值，零程式碼改動。
      - key: PRIVATE_FILE_STORAGE_DRIVER
        value: s3
      - key: PRIVATE_FILE_STORAGE_S3_ENDPOINT
        sync: false
      - key: PRIVATE_FILE_STORAGE_S3_REGION
        sync: false
      - key: PRIVATE_FILE_STORAGE_S3_BUCKET
        sync: false
      - key: PRIVATE_FILE_STORAGE_S3_ACCESS_KEY_ID
        sync: false
      - key: PRIVATE_FILE_STORAGE_S3_SECRET_ACCESS_KEY
        sync: false

      # --- 對外 URL（第二階段回填，不可留空）---
      - key: PUBLIC_BACKEND_URL
        sync: false
      - key: PUBLIC_WEB_URL
        sync: false

      # --- 人工轉帳的收款帳戶 ---
      # 四值必須同時設定，缺一即整組不可用（付款指示顯示「尚未設定」）。
      # 刻意不 fail closed（config/paymentBankInfo.js:26），因此只能靠檢查表把關。
      # 已知佔位帳號會被明確拒絕。
      - key: PAYMENT_BANK_NAME
        sync: false
      - key: PAYMENT_BANK_CODE
        sync: false
      - key: PAYMENT_BANK_ACCOUNT
        sync: false
      - key: PAYMENT_BANK_ACCOUNT_NAME
        sync: false

  # ---------------------------------------------------------------------------
  # Frontend — Next.js 15 App Router（無法 static export，必須有 Node runtime）
  # ---------------------------------------------------------------------------
  - type: web
    name: teaching-platform-web
    runtime: node
    plan: free
    region: singapore
    rootDir: frontend
    # npm workspaces monorepo：lockfile 在 frontend/，build 走 workspace script。
    buildCommand: npm ci && npm run build:web
    startCommand: npm run start -w @teaching-platform/web
    autoDeployTrigger: "off"
    # 刻意不設 healthCheckPath：首頁是 server-rendered，冷啟動時可能較慢，
    # 讓 Render 用預設的 port 檢查即可，避免把慢啟動誤判為部署失敗。
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Next server 端呼叫 Backend 的位址（第二階段回填）。
      # 未設會回退 http://localhost:3000 → 整站 server 端 API 呼叫失效。
      # 這個值**不會**進入瀏覽器 bundle（repo 的 NEXT_PUBLIC_* 數量為 0，必須維持）。
      - key: API_BASE_URL
        sync: false
